<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ barang.nama }} - Warna Mandiri</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="container">
        <section class="section">
            <h2>Edit Data Barang</h2>

            <form action="{{ url_for('edit_barang', index=index) }}" method="POST" enctype="multipart/form-data"
                class="form-barang" id="formBarang">
                <label for="nama">Nama Barang</label>
                <input type="text" id="nama" name="nama" value="{{ barang.nama }}" required>

                <label for="kode">Kode Barang</label>
                <input type="text" id="kode" name="kode" value="{{ barang.kode }}" required>

                <label for="kategori">Kategori</label>
                <input type="text" id="kategori" name="kategori" value="{{ barang.kategori }}" required>

                <label for="harga">Harga</label>
                <input type="number" id="harga" name="harga" value="{{ barang.harga }}" min="0" required>

                <label for="stok">Stok</label>
                <input type="number" id="stok" name="stok" value="{{ barang.stok }}" min="0" required>

                <label for="satuan">Satuan</label>
                <select id="satuan" name="satuan">
                    {% for pilihan in ["Pcs", "Meter", "Lembar"] %}
                    <option value="{{ pilihan }}" {% if barang.satuan==pilihan %}selected{% endif %}>{{ pilihan }}
                    </option>
                    {% endfor %}
                </select>

                <label for="kondisi">Kondisi</label>
                <select id="kondisi" name="kondisi">
                    {% for pilihan in ["Baik", "Rusak", "Habis"] %}
                    <option value="{{ pilihan }}" {% if barang.kondisi==pilihan %}selected{% endif %}>{{ pilihan }}
                    </option>
                    {% endfor %}
                </select>

                <label for="lokasi">Lokasi Barang</label>
                <input type="text" id="lokasi" name="lokasi" value="{{ barang.lokasi|default('', true) }}"
                    placeholder="Contoh: Rak A1" required>

                <label for="gambar">Ganti Foto Barang (opsional)</label>
                <input type="file" id="gambar" name="gambar" accept="image/*">
                {% if barang.gambar %}
                <p>Foto saat ini: {{ barang.gambar }}</p>
                {% endif %}

                <button type="submit">Simpan Perubahan</button>
                <a href="{{ url_for('index', _anchor='daftar') }}" class="tombol-kembali">Batal</a>
            </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
